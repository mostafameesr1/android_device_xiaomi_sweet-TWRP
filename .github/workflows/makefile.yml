name: OFOX

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        required: true
        default: '14.1'
        type: choice
        options: [14.1, 12.1, 11.0]
      DEVICE_TREE:
        description: 'Custom Recovery Tree URL'
        required: true
        default: 'https://github.com/mostafameesr1/android_device_xiaomi_sweet-TWRP.git'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'android-12.1'
      DEVICE_PATH:
        description: 'Device Path (e.g., device/xiaomi/sweet)'
        required: true
        default: 'device/xiaomi/sweet'
      DEVICE_NAME:
        description: 'Device Codename'
        required: true
        default: 'sweet'
      BUILD_TARGET:
        description: 'Build Target'
        required: true
        default: 'recovery'
        type: choice
        options: [boot, recovery, vendorboot]
      BUILD_TYPE:
        description: 'Build Type'
        required: true
        default: 'eng'
        type: choice
        options: [eng, userdebug, user]
      LDCHECK:
        description: 'Blob to Check (for LDCheck)'
        required: true
        default: 'system/bin/qseecomd'

jobs:
  build:
    name: Build OFR by ${{ github.actor }}
    runs-on: ubuntu-22.04
    env:
      GITHUB_TOKEN: ${{ secrets.RECOVERY }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-clean system cache
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Display Inputs
        run: |
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "Build Type: ${{ github.event.inputs.BUILD_TYPE }}"
          echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"

      - name: Sync Sources
        run: |
          repo init -u https://github.com/OrangeFox-Recovery/manifest.git -b ${{ github.event.inputs.MANIFEST_BRANCH }}
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ${{ github.event.inputs.DEVICE_PATH }}
          repo sync -c device/xiaomi vendor/xiaomi kernel/xiaomi --no-tags --no-clone-bundle --depth=1

      - name: Cleanup Repo Cache
        run: |
          rm -rf .repo/projects
          rm -rf .repo/project-objects
          rm -rf .repo/manifests.git
          rm -rf prebuilts
          df -h

      - name: Build OrangeFox
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.BUILD_TYPE }}
          mka ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-Recovery-${{ github.event.inputs.DEVICE_NAME }}
          path: out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*recovery*.imgname: OFOX

